spring.application.name=task_manager

spring.datasource.url=jdbc:mysql://localhost:3306/mydb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/taskmanager

# Keycloak Admin API settings (DEV)
keycloak.base-url=http://localhost:8180
keycloak.realm=taskmanager


